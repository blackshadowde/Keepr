[package]
name = "keepr_pq"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# ML-KEM from Cryspen's libcrux: formally verified (panic freedom,
# functional correctness, secret independence); the one Signal uses.
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
