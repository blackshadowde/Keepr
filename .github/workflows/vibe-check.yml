name: Keepr check

# Code check only (no APK): about 3 minutes. Shows every error on the run's
# summary page. Use it before "Vibe release" to catch mistakes quickly.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - run: flutter pub get

      - name: Check code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.txt || {
            grep -E "^\s*error " analyze.txt | head -50 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          echo "### Code check" >> "$GITHUB_STEP_SUMMARY"
          tail -1 analyze.txt >> "$GITHUB_STEP_SUMMARY"

      # Bujji's memory rules, with real sentences
      - name: Bujji tests
        run: flutter test test/bujji_test.dart

      # The full analyzer output (warnings and hints too) as a check on the
      # commit, readable from the GitHub API and the commit's Checks tab.
      - name: Analyzer report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          test -f analyze.txt || exit 0
          grep -E "^\s*(error|warning|info) " analyze.txt > issues.txt
          COUNT=$(wc -l < issues.txt)
          head -c 60000 issues.txt > report.txt
          python3 - <<'PY'
          import json, os
          body = {
            "name": "Analyzer report",
            "head_sha": os.environ["GITHUB_SHA"],
            "status": "completed",
            "conclusion": "neutral",
            "output": {
              "title": "flutter analyze",
              "summary": open("analyze.txt").read().strip().splitlines()[-1][:1000],
              "text": open("report.txt").read(),
            },
          }
          json.dump(body, open("check.json", "w"))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --input check.json > /dev/null
          echo "$COUNT issues reported"


  # The post-quantum Rust module (ML-KEM-768 via libcrux), built and
  # tested on its own.
  pq:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/keepr_pq/rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release

  # Bujji's optional sentence models, run with the Rust module: the files
  # and their sizes, and a real meaning check with each.
  models:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/keepr_pq/rust
    steps:
      - uses: actions/checkout@v4
      - name: Files
        run: |
          for r in Xenova/all-MiniLM-L6-v2 Xenova/paraphrase-multilingual-MiniLM-L12-v2; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main/onnx" | python3 -c "import json,sys; [print(f['path'], f.get('size')) for f in json.load(sys.stdin)]"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c "import json,sys; [print(f['path'], f.get('size')) for f in json.load(sys.stdin) if f['type']=='file']"
          done
      - name: Meaning check
        run: |
          set -e
          get() { mkdir -p "$2"; curl -sfL -o "$2/model.onnx" "https://huggingface.co/$1/resolve/main/onnx/model_quantized.onnx"; curl -sfL -o "$2/tokenizer.json" "https://huggingface.co/$1/resolve/main/tokenizer.json"; ls -la "$2"; sha256sum "$2"/*; }
          get Xenova/all-MiniLM-L6-v2 /tmp/small
          get Xenova/paraphrase-multilingual-MiniLM-L12-v2 /tmp/multi
          KEEPR_MODEL_DIR=/tmp/small cargo test --release -- --ignored --nocapture matches_meaning
          KEEPR_MODEL_DIR=/tmp/multi cargo test --release -- --ignored --nocapture matches_meaning
