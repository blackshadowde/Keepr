name: Keepr PQ test

# Builds and tests the post-quantum Rust module (ML-KEM-768 via libcrux)
# on its own, without the app. About a minute.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/keepr_pq/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --release
